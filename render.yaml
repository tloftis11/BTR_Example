databases:
  - name: biothreat-db
    databaseName: biothreat
    user: biothreat
    plan: basic-256mb

services:
  # ── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: biothreat-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biothreat-db
          property: connectionString
      - key: SOCRATA_APP_TOKEN
        sync: false   # set manually in Render dashboard
      - key: CORS_ORIGINS
        value: '["*"]'

  # ── Frontend (static) ────────────────────────────────────────────────
  - type: web
    name: biothreat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://biothreat-api.onrender.com

  # ── Daily pipeline cron ──────────────────────────────────────────────
  - type: cron
    name: biothreat-pipeline
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 6 * * *"   # 06:00 UTC daily
    startCommand: python -c "import asyncio; from app.pipeline.runner import run_all_sources; asyncio.run(run_all_sources())"
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biothreat-db
          property: connectionString
      - key: SOCRATA_APP_TOKEN
        sync: false
